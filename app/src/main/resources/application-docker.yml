# Day31 — Docker Compose로 mysql 컨테이너와 함께 뜰 때 쓰는 프로필.
# compose.yaml에서 mysql 서비스 이름이 그대로 컨테이너 네트워크 안의 호스트명이 된다 —
# 그래서 localhost가 아니라 "mysql"로 접속한다(같은 compose 네트워크 안에서만 통하는 이름).
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/studyroom?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:studyroom}
    password: ${MYSQL_PASSWORD:studyroom}
  h2:
    console:
      enabled: false

jwt:
  # compose.yaml에서 JWT_SECRET을 안 주면 이 기본값(로컬/CI 전용, 운영 값과 다름)을 쓴다.
  secret: ${JWT_SECRET:studyroom-docker-secret-key-must-be-at-least-32-bytes-long}
