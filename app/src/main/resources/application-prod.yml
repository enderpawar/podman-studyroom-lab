# Day29 — 운영 프로필. 실제 비밀값은 절대 커밋하지 않는다. 배포 환경(서버의 OS 환경변수,
# GitHub Actions secrets 등)에서 아래 이름 그대로 주입한다. 값이 없으면 Spring Boot가
# "Could not resolve placeholder" 예외로 기동을 막아준다 — 비밀값 없이 조용히 뜨는 것보다 낫다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false # 운영 DB는 H2가 아니고, H2 콘솔은 어차피 공격 표면이라 꺼둔다.

jwt:
  secret: ${JWT_SECRET}
