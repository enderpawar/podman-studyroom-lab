name: CI

# app/ 하나만 빌드·테스트한다. (Study_plan.md 5.5)
# Podman 실험 저장소는 기본 브랜치가 main이라 main을 추가했다. 수동 실행용 workflow_dispatch도 추가.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # Day32 — 잡 이름이 build였지만 실제로는 테스트만 돌린다. docker 잡이 needs: test로 이 잡을
  # 참조하므로, 이름을 실제 역할(test)에 맞게 바꿨다.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle*', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

      # Day32 — 예전에는 실패했을 때만 리포트를 올렸다. 성공 케이스의 리포트도 남겨서
      # "몇 개 중 몇 개 통과했는지"를 매 실행마다 아티팩트로 확인할 수 있게 always()로 바꿨다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test

  # Day32 — test 잡이 통과한 뒤에만 이미지 빌드·컨테이너 기동까지 검증한다.
  # 로컬에는 Docker가 없어서(day31.md) 이 잡이 Dockerfile·compose.yaml을 실제로 실행해보는 첫 자리다.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t study-room-api:ci ./app

      - name: Start containers (app + mysql)
        run: docker compose up -d --wait

      # app 컨테이너 자체에는 헬스체크를 안 달았다(JRE 이미지에 curl이 없어서) — 그래서
      # --wait는 "컨테이너가 떴다"까지만 보장한다. 스프링 컨텍스트가 뜨는 시간까지는
      # 호스트에서 재시도 루프로 기다린다.
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              echo "health check passed"
              exit 0
            fi
            echo "waiting for app to become healthy... ($i/30)"
            sleep 2
          done
          echo "app never responded on /health"
          docker compose logs
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # Podman 실험 — docker 잡과 별개로, 같은 이미지를 Podman으로 빌드하고 쿠버네티스 YAML
  # (deploy/studyroom-pod.yaml)을 kube play로 그대로 띄워 /health까지 확인한다.
  # GitHub 호스티드 Ubuntu 러너에는 Podman이 미리 설치돼 있다. 러너 이미지마다 버전이 다르므로 로그에 남긴다.
  podman:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podman version
        run: |
          podman version
          podman info --format 'rootless={{.Host.Security.Rootless}}'

      - name: Build app image
        run: podman build -t localhost/study-room-api:dev ./app

      - name: Start pod from Kubernetes YAML
        run: podman kube play deploy/studyroom-pod.yaml

      # kube YAML에는 depends_on이 없어서 app이 mysql보다 먼저 뜨면 재시작된다(restartPolicy: Always).
      # 그 재시작 시간까지 포함해 기다린다.
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "health check passed"
              exit 0
            fi
            echo "waiting for app to become healthy... ($i/30)"
            sleep 2
          done
          echo "app never responded on /health"
          exit 1

      - name: Show pod and container logs on failure
        if: failure()
        run: |
          podman ps -a --pod
          podman logs studyroom-mysql || true
          podman logs studyroom-app || true

      - name: Tear down
        if: always()
        run: podman kube down deploy/studyroom-pod.yaml
